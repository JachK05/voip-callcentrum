[udp-demo]
type=transport
protocol=udp
bind=0.0.0.0:15060
external_signaling_address=127.0.0.1
external_signaling_port=15060

[1001]
type=endpoint
transport=udp-demo
context=sip-vstup
disallow=all
allow=alaw,ulaw
auth=demo-1001
aors=1001
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
media_address=127.0.0.1
ice_support=no
dtmf_mode=auto_info

[demo-1001]
type=auth
auth_type=userpass
username=1001
password=VoIP-Demo-1001

[1001]
type=aor
max_contacts=1
remove_existing=yes
