[sip-vstup]
exten => _70[12],1,Set(LABQUEUE=ukazka)
 same => n,QueueLog(${LABQUEUE},${UNIQUEID},NONE,SIPCALLID,${CHANNEL(pjsip,call-id)})
 same => n,Goto(vstup,${EXTEN},1)

exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[sip-agent]
exten => 101,1,Ringing()
 same => n,Wait(4)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(custom/prijato)
 same => n,Wait(2)
 same => n,Hangup()
