; Příchozí strana hovoru. 701 má jedno menu, 702 má dvě.
[vstup]
exten => _70[12],1,QueueLog(${LABQUEUE},${UNIQUEID},NONE,LABSTART,${EXTEN})
 same => n,Answer()
 same => n,Read(VOLBA,custom/menu1,1,,1,8)
 same => n,QueueLog(${LABQUEUE},${UNIQUEID},NONE,MENU1,${VOLBA})
 same => n,GotoIf($["${VOLBA}" != "1"]?chyba)
 same => n,GotoIf($["${EXTEN}" = "701"]?fronta)
 same => n,Read(VOLBA,custom/menu2,1,,1,8)
 same => n,QueueLog(${LABQUEUE},${UNIQUEID},NONE,MENU2,${VOLBA})
 same => n,GotoIf($["${VOLBA}" != "2"]?chyba)
 same => n(fronta),Queue(${LABQUEUE},r,,,75)
 same => n,Hangup()
 same => n(chyba),QueueLog(${LABQUEUE},${UNIQUEID},NONE,IVRFAIL,${READSTATUS})
 same => n,Hangup()

; Druhá strana stejného Local hovoru stiskne klávesy jako zákazník.
[volajici]
exten => _70[12],1,Wait(2)
 same => n,SendDTMF(1)
 same => n,GotoIf($["${EXTEN}" = "701"]?cekani)
 same => n,Wait(2)
 same => n,SendDTMF(2)
 same => n(cekani),Wait(105)
 same => n,Hangup()

; A101 zvedá za 1 s, A102 a A103 za 3 s. Doba obsluhy je stejná.
[agenti]
exten => _10[123],1,Set(ZAMEK=${TRYLOCK(agent-${EXTEN})})
 same => n,GotoIf($["${ZAMEK}" != "1"]?obsazeno)
 same => n,Set(CHANNEL(hangup_handler_push)=uvolni,s,1(${EXTEN}))
 same => n,Set(DEVICE_STATE(Custom:agent${EXTEN})=RINGING)
 same => n,Ringing()
 same => n,GotoIf($["${EXTEN}" = "101"]?rychly)
 same => n,Wait(3)
 same => n,Goto(prijmi)
 same => n(rychly),Wait(1)
 same => n(prijmi),Set(DEVICE_STATE(Custom:agent${EXTEN})=INUSE)
 same => n,Answer()
 same => n,Wait(6)
 same => n,Hangup()
 same => n(obsazeno),Busy(1)

[uvolni]
exten => s,1,Set(DEVICE_STATE(Custom:agent${ARG1})=NOT_INUSE)
 same => n,Return()
